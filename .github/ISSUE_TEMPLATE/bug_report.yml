name: Bug report
description: Report a reproducible problem in Mercury.
labels: []
body:
  - type: markdown
    attributes:
      value: "Remove credentials, private paths and project content from logs and screenshots. For vulnerabilities, follow SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, Mercury revision, and relevant Codex/Claude CLI versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a small example with fictional data where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
    validations:
      required: false
