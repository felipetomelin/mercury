name: Feature request
description: Describe a workflow Mercury could improve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the concrete workflow and its current difficulty.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Describe the outcome, an example, and any constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
