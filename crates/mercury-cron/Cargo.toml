[package]
name = "mercury-cron"
version = "0.0.0"
edition = "2021"
description = "Schedule and job model for Mercury crons"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["parsing", "formatting"] }
toml = "0.8"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }
uuid = { version = "1.22", features = ["v4"] }
