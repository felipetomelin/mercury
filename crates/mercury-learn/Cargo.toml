[package]
name = "mercury-learn"
version = "0.0.0"
edition = "2021"
description = "Allowlisted, reversible improvements for Mercury"

[dependencies]
libc = "0.2"
mercury-cron = { path = "../mercury-cron" }
mercury-router = { path = "../mercury-router" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }
time = "0.3"
toml = "0.8"
toml_edit = "0.22.27"
uuid = { version = "1.22", features = ["v4"] }
